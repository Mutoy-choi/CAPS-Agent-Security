[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caps-research-chat"
version = "0.1.0"
description = "Consent-aware consumer chat and de-identified AI safety research data collection"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mutoy-choi" }]
license = { text = "Proprietary - prototype" }
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
caps-research-chat = "caps_app.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caps_app"]

[tool.hatch.build.targets.wheel.force-include]
"src/caps_app/static" = "caps_app/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
