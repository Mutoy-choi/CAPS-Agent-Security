[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caps-verify"
version = "0.8.0"
description = "Cross-platform synthetic model-unlock and agent-security evaluation runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mutoy-choi" }]
license = { text = "Proprietary - research prototype" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]
gateway = [
  "httpx>=0.28,<1",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]
multimodal = ["Pillow>=11.3,<13"]
inspect = ["inspect-ai>=0.3.251,<0.4"]
pyrit = ["pyrit>=1.0,<2"]
garak = ["garak>=0.15.1,<0.16; python_version < '3.13'"]
agentdojo = ["agentdojo>=0.1.35,<0.2"]
research = [
  "inspect-ai>=0.3.251,<0.4",
  "pyrit>=1.0,<2",
  "agentdojo>=0.1.35,<0.2",
  "Pillow>=11.3,<13",
]
research-all = [
  "inspect-ai>=0.3.251,<0.4",
  "pyrit>=1.0,<2",
  "agentdojo>=0.1.35,<0.2",
  "Pillow>=11.3,<13",
  "garak>=0.15.1,<0.16; python_version < '3.13'",
]
dev = [
  "httpx>=0.28,<1",
  "Pillow>=11.3,<13",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
caps-verify = "caps_verify.cli:main"
caps-verify-mcp = "caps_verify.mcp_server:main"
caps-verify-collector = "caps_verify.collector:main"
caps-verify-gateway = "caps_verify.gateway:main"
caps-verify-shadow-worker = "caps_verify.shadow:main"
caps-verify-runtime = "caps_verify.runtime:main"

[project.entry-points.inspect_ai]
caps_verify = "caps_verify.integrations.inspect_registry"

[tool.hatch.build.targets.wheel]
packages = ["src/caps_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
