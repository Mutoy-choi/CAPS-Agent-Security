[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caps-verify"
version = "0.4.0"
description = "Capability-Attachment Path Security verification for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mutoy-choi" }]
license = { text = "Proprietary - internal evaluation prototype" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]
gateway = [
  "httpx>=0.28,<1",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
caps-verify = "caps_verify.cli:main"
caps-verify-mcp = "caps_verify.mcp_server:main"
caps-verify-collector = "caps_verify.collector:main"
caps-verify-gateway = "caps_verify.gateway:main"
caps-verify-shadow-worker = "caps_verify.shadow:main"
caps-verify-runtime = "caps_verify.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caps_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
